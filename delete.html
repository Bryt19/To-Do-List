<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deleted Tasks</title>
  <style>
    :root {
      --primary: #1e88e5;
      --danger: #e53935;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1e1e1e;
      --muted: #777;
      --shadow: rgba(0, 0, 0, 0.1);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      background-color: #1e1e2f;
      color: white;
      text-align: center;
      padding: 1rem 2rem;
    }

    main {
      flex: 1;
      padding: 3rem 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      background: #fff;
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .title-bar h1 {
      font-size: 2.5rem;
      color: var(--primary);
    }

    .title-bar a {
      background: var(--primary);
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 500;
    }

    .task-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .task-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 4px 12px var(--shadow);
      padding: 1.5rem;
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .task-card:hover {
      transform: translateY(-5px);
    }

    .task-card h3 {
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    .task-card p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: 1.2rem;
      padding: 3rem;
      grid-column: 1/-1;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: var(--radius);
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    .modal-content h2 {
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .modal-content p {
      font-size: 1rem;
      margin: 0.5rem 0;
    }

    .close-btn {
      position: absolute;
      right: 1rem;
      top: 1rem;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--muted);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    .modal-actions button {
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: var(--radius);
      background: var(--danger);
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>To-Do Elite</h1>
  </header>

  <main>
    <div class="container">
      <div class="title-bar">
        <h1>Deleted Tasks</h1>
        <a href="homepage.html">← Back</a>
      </div>
      <div id="taskGrid" class="task-grid"></div>
    </div>
  </main>

  <footer>
    &copy; 2025 To-Do Elite
  </footer>

  <div id="taskModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2>Task Details</h2>
      <p><strong>Task:</strong> <span id="modalText"></span></p>
      <p><strong>Deleted On:</strong> <span id="modalDeleted"></span></p>
      <p><strong>Start Date:</strong> <span id="modalStart"></span></p>
      <p><strong>End Date:</strong> <span id="modalEnd"></span></p>
      <p><strong>Status:</strong> <span id="modalStatus"></span></p>
      <div class="modal-actions">
        <button onclick="permanentlyDelete()">Delete Permanently</button>
      </div>
    </div>
  </div>

  <script>
    const tasks = JSON.parse(localStorage.getItem('deletedTasks')) || [];
    let current = null;

    const taskGrid = document.getElementById('taskGrid');

    function showTasks() {
      taskGrid.innerHTML = '';
      if (!tasks.length) {
        taskGrid.innerHTML = '<div class="empty-state">No deleted tasks available.</div>';
        return;
      }

      tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = 'task-card';
        div.innerHTML = `
          <h3>${task.text || 'Untitled Task'}</h3>
          <p>Status: ${task.status || 'Unknown'}</p>
          <p>Deleted: ${new Date(task.deletedAt).toLocaleString() || 'N/A'}</p>
        `;
        div.onclick = () => openModal(task);
        taskGrid.appendChild(div);
      });
    }

    function openModal(task) {
      current = task;
      document.getElementById('modalText').textContent = task.text;
      document.getElementById('modalDeleted').textContent = new Date(task.deletedAt).toLocaleString();
      document.getElementById('modalStart').textContent = task.startDate ? new Date(task.startDate).toLocaleDateString() : 'Not set';
      document.getElementById('modalEnd').textContent = task.endDate ? new Date(task.endDate).toLocaleDateString() : 'Not set';
      document.getElementById('modalStatus').textContent = task.status || 'Unknown';
      document.getElementById('taskModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('taskModal').style.display = 'none';
    }

    window.onclick = e => {
      if (e.target === document.getElementById('taskModal')) closeModal();
    }

    function permanentlyDelete() {
      if (!current) return;
      const i = tasks.findIndex(t => t.id === current.id);
      if (i > -1) {
        tasks.splice(i, 1);
        localStorage.setItem('deletedTasks', JSON.stringify(tasks));
        showTasks();
      }
      closeModal();
    }

    showTasks();
  </script>
</body>
</html>
