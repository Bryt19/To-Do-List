<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deleted Tasks - Elite To-Do</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --secondary: #f59e0b;
        --success: #10b981;
        --danger: #ef4444;
        --danger-dark: #dc2626;
        --warning: #f59e0b;
        --info: #3b82f6;
        --dark: #0f172a;
        --darker: #020617;
        --light: #f8fafc;
        --white: #ffffff;
        --gray-50: #f9fafb;
        --gray-100: #f3f4f6;
        --gray-200: #e5e7eb;
        --gray-300: #d1d5db;
        --gray-400: #9ca3af;
        --gray-500: #6b7280;
        --gray-600: #4b5563;
        --gray-700: #374151;
        --gray-800: #1f2937;
        --gray-900: #111827;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1),
          0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1),
          0 8px 10px -6px rgb(0 0 0 / 0.1);
        --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
        --border-radius: 12px;
        --border-radius-lg: 16px;
        --border-radius-xl: 20px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        background: linear-gradient(
          135deg,
          #667eea 0%,
          #764ba2 50%,
          #f093fb 100%
        );
        min-height: 100vh;
        color: var(--gray-800);
        line-height: 1.6;
        overflow-x: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      /* Animated Background */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
            circle at 20% 80%,
            rgba(120, 119, 198, 0.3) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(255, 119, 198, 0.3) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 40% 40%,
            rgba(120, 219, 255, 0.2) 0%,
            transparent 50%
          );
        animation: backgroundShift 20s ease-in-out infinite;
        z-index: -1;
      }

      @keyframes backgroundShift {
        0%,
        100% {
          transform: scale(1) rotate(0deg);
        }
        50% {
          transform: scale(1.1) rotate(1deg);
        }
      }

      /* Floating Particles */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
      }

      .particle {
        position: absolute;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        animation: float 6s ease-in-out infinite;
      }

      .particle:nth-child(1) {
        width: 4px;
        height: 4px;
        left: 10%;
        animation-delay: 0s;
      }
      .particle:nth-child(2) {
        width: 6px;
        height: 6px;
        left: 20%;
        animation-delay: 1s;
      }
      .particle:nth-child(3) {
        width: 3px;
        height: 3px;
        left: 30%;
        animation-delay: 2s;
      }
      .particle:nth-child(4) {
        width: 5px;
        height: 5px;
        left: 40%;
        animation-delay: 3s;
      }
      .particle:nth-child(5) {
        width: 4px;
        height: 4px;
        left: 50%;
        animation-delay: 4s;
      }
      .particle:nth-child(6) {
        width: 6px;
        height: 6px;
        left: 60%;
        animation-delay: 5s;
      }
      .particle:nth-child(7) {
        width: 3px;
        height: 3px;
        left: 70%;
        animation-delay: 6s;
      }
      .particle:nth-child(8) {
        width: 5px;
        height: 5px;
        left: 80%;
        animation-delay: 7s;
      }
      .particle:nth-child(9) {
        width: 4px;
        height: 4px;
        left: 90%;
        animation-delay: 8s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(100vh) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100px) rotate(360deg);
          opacity: 0;
        }
      }

      header {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        text-align: center;
        padding: 1.5rem 0;
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: 0.05em;
        color: var(--white);
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
      }

      header::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        0% {
          left: -100%;
        }
        100% {
          left: 100%;
        }
      }

      main {
        flex: 1;
        padding: 2rem;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: calc(100vh - 140px);
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(30px);
        border-radius: var(--border-radius-xl);
        padding: 2.5rem;
        width: 100%;
        max-width: 1400px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25),
          0 0 0 1px rgba(255, 255, 255, 0.1);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
      }

      .container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          var(--danger),
          var(--warning),
          var(--primary)
        );
        background-size: 200% 100%;
        animation: gradientShift 3s ease infinite;
      }

      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      .container:hover {
        transform: translateY(-8px);
        box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.3),
          0 0 0 1px rgba(255, 255, 255, 0.2);
      }

      .title-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2.5rem;
        padding-bottom: 1.5rem;
        border-bottom: 2px solid var(--gray-100);
      }

      .title-section {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .title-icon {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, var(--danger), var(--danger-dark));
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-lg);
        animation: iconPulse 2s ease-in-out infinite;
      }

      @keyframes iconPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      .title-icon i {
        font-size: 1.5rem;
        color: var(--white);
      }

      .title-content h1 {
        font-size: 2.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--danger), var(--danger-dark));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.25rem;
      }

      .title-content p {
        color: var(--gray-600);
        font-size: 1rem;
        font-weight: 500;
      }

      .back-btn {
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        color: var(--white);
        padding: 0.875rem 1.5rem;
        border-radius: var(--border-radius);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        box-shadow: var(--shadow-md);
      }

      .back-btn:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
      }

      .back-btn i {
        font-size: 0.9rem;
      }

      .task-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 1.5rem;
      }

      .task-card {
        background: var(--white);
        border-radius: var(--border-radius-lg);
        box-shadow: var(--shadow-md);
        padding: 1.75rem;
        transition: var(--transition);
        cursor: pointer;
        border: 1px solid var(--gray-100);
        position: relative;
        overflow: hidden;
      }

      .task-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--danger), var(--warning));
        transform: scaleX(0);
        transition: transform 0.3s ease;
      }

      .task-card:hover {
        transform: translateY(-8px);
        box-shadow: var(--shadow-xl);
      }

      .task-card:hover::before {
        transform: scaleX(1);
      }

      .task-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1rem;
      }

      .task-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--gray-900);
        line-height: 1.4;
        flex: 1;
      }

      .task-status {
        background: linear-gradient(135deg, var(--danger), var(--danger-dark));
        color: var(--white);
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .task-meta {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .task-meta-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--gray-600);
        font-size: 0.9rem;
      }

      .task-meta-item i {
        color: var(--gray-400);
        font-size: 0.8rem;
        width: 16px;
      }

      .empty-state {
        text-align: center;
        color: var(--gray-500);
        padding: 4rem 2rem;
        grid-column: 1/-1;
      }

      .empty-icon {
        width: 80px;
        height: 80px;
        background: var(--gray-100);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
      }

      .empty-icon i {
        font-size: 2rem;
        color: var(--gray-400);
      }

      .empty-state h3 {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--gray-700);
        margin-bottom: 0.5rem;
      }

      .empty-state p {
        font-size: 1rem;
        color: var(--gray-500);
      }

      /* Modal */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .modal.show {
        opacity: 1;
      }

      .modal-content {
        background: var(--white);
        padding: 2.5rem;
        border-radius: var(--border-radius-xl);
        width: 100%;
        max-width: 600px;
        position: relative;
        box-shadow: var(--shadow-2xl);
        transform: scale(0.9) translateY(20px);
        transition: transform 0.3s ease;
      }

      .modal.show .modal-content {
        transform: scale(1) translateY(0);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid var(--gray-100);
      }

      .modal-header h2 {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--gray-900);
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .modal-header h2 i {
        color: var(--danger);
      }

      .close-btn {
        background: var(--gray-100);
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: var(--transition);
        font-size: 1.25rem;
        color: var(--gray-600);
      }

      .close-btn:hover {
        background: var(--danger);
        color: var(--white);
        transform: rotate(90deg);
      }

      .modal-body {
        margin-bottom: 2rem;
      }

      .detail-item {
        display: flex;
        flex-direction: column;
        margin-bottom: 1.5rem;
      }

      .detail-label {
        font-weight: 600;
        color: var(--gray-700);
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
      }

      .detail-value {
        background: var(--gray-50);
        padding: 1rem;
        border-radius: var(--border-radius);
        border: 1px solid var(--gray-200);
        color: var(--gray-900);
        font-size: 1rem;
        line-height: 1.5;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
      }

      .btn {
        padding: 0.875rem 1.5rem;
        border: none;
        border-radius: var(--border-radius);
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn-danger {
        background: linear-gradient(135deg, var(--danger), var(--danger-dark));
        color: var(--white);
        box-shadow: var(--shadow-md);
      }

      .btn-danger:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
      }

      .btn-secondary {
        background: var(--gray-100);
        color: var(--gray-700);
      }

      .btn-secondary:hover {
        background: var(--gray-200);
      }

      footer {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        text-align: center;
        padding: 1rem 0;
        font-size: 0.875rem;
        color: var(--white);
        font-weight: 500;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        main {
          padding: 1rem;
        }

        .container {
          padding: 1.5rem;
          margin: 1rem;
        }

        .title-bar {
          flex-direction: column;
          gap: 1rem;
          text-align: center;
        }

        .title-section {
          flex-direction: column;
          text-align: center;
        }

        .title-content h1 {
          font-size: 2rem;
        }

        .task-grid {
          grid-template-columns: 1fr;
          gap: 1rem;
        }

        .modal-content {
          margin: 1rem;
          padding: 1.5rem;
        }

        .modal-actions {
          flex-direction: column;
        }
      }

      @media (max-width: 480px) {
        .container {
          padding: 1rem;
        }

        .title-content h1 {
          font-size: 1.75rem;
        }

        .task-card {
          padding: 1.25rem;
        }

        .modal-content {
          padding: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Animated Background Particles -->
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <header>Elite To-Do List</header>

    <main>
      <div class="container">
        <div class="title-bar">
          <div class="title-section">
            <div class="title-icon">
              <i class="fas fa-trash-alt"></i>
            </div>
            <div class="title-content">
              <h1>Deleted Tasks</h1>
              <p>Manage your permanently deleted tasks</p>
            </div>
          </div>
          <a href="homepage.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            Back to Dashboard
          </a>
        </div>

        <div id="taskGrid" class="task-grid"></div>
      </div>
    </main>

    <footer>© 2025 Elite To-Do List. All rights reserved.</footer>

    <!-- Task Details Modal -->
    <div id="taskModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>
            <i class="fas fa-info-circle"></i>
            Task Details
          </h2>
          <button class="close-btn" onclick="closeModal()">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div class="modal-body">
          <div class="detail-item">
            <div class="detail-label">Task Description</div>
            <div class="detail-value" id="modalText"></div>
          </div>

          <div class="detail-item">
            <div class="detail-label">Deleted On</div>
            <div class="detail-value" id="modalDeleted"></div>
          </div>

          <div class="detail-item">
            <div class="detail-label">Start Date</div>
            <div class="detail-value" id="modalStart"></div>
          </div>

          <div class="detail-item">
            <div class="detail-label">Due Date</div>
            <div class="detail-value" id="modalEnd"></div>
          </div>

          <div class="detail-item">
            <div class="detail-label">Status</div>
            <div class="detail-value" id="modalStatus"></div>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">
            <i class="fas fa-times"></i>
            Cancel
          </button>
          <button class="btn btn-danger" onclick="permanentlyDelete()">
            <i class="fas fa-trash"></i>
            Delete Permanently
          </button>
        </div>
      </div>
    </div>

    <script>
      const tasks = JSON.parse(localStorage.getItem("deletedTasks")) || [];
      let current = null;

      const taskGrid = document.getElementById("taskGrid");
      const modal = document.getElementById("taskModal");

      function showTasks() {
        taskGrid.innerHTML = "";

        if (!tasks.length) {
          taskGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <i class="fas fa-trash-alt"></i>
            </div>
            <h3>No Deleted Tasks</h3>
            <p>Tasks you delete will appear here for permanent removal</p>
          </div>
        `;
          return;
        }

        tasks.forEach((task, index) => {
          const div = document.createElement("div");
          div.className = "task-card";
          div.style.animationDelay = `${index * 0.1}s`;

          const deletedDate = task.deletedAt
            ? new Date(task.deletedAt)
            : new Date();
          const startDate = task.startDate ? new Date(task.startDate) : null;
          const dueDate = task.dueDate ? new Date(task.dueDate) : null;

          div.innerHTML = `
          <div class="task-header">
            <div class="task-title">${task.text || "Untitled Task"}</div>
            <div class="task-status">${task.status || "Unknown"}</div>
          </div>
          <div class="task-meta">
            <div class="task-meta-item">
              <i class="fas fa-calendar-times"></i>
              <span>Deleted: ${deletedDate.toLocaleDateString()} at ${deletedDate.toLocaleTimeString()}</span>
            </div>
            ${
              startDate
                ? `
              <div class="task-meta-item">
                <i class="fas fa-calendar-plus"></i>
                <span>Started: ${startDate.toLocaleDateString()}</span>
              </div>
            `
                : ""
            }
            ${
              dueDate
                ? `
              <div class="task-meta-item">
                <i class="fas fa-calendar-check"></i>
                <span>Due: ${dueDate.toLocaleDateString()}</span>
              </div>
            `
                : ""
            }
          </div>
        `;

          div.onclick = () => openModal(task);
          taskGrid.appendChild(div);
        });
      }

      function openModal(task) {
        current = task;

        const deletedDate = task.deletedAt
          ? new Date(task.deletedAt)
          : new Date();
        const startDate = task.startDate ? new Date(task.startDate) : null;
        const dueDate = task.dueDate ? new Date(task.dueDate) : null;

        document.getElementById("modalText").textContent =
          task.text || "No description available";
        document.getElementById(
          "modalDeleted"
        ).textContent = `${deletedDate.toLocaleDateString()} at ${deletedDate.toLocaleTimeString()}`;
        document.getElementById("modalStart").textContent = startDate
          ? startDate.toLocaleDateString()
          : "Not set";
        document.getElementById("modalEnd").textContent = dueDate
          ? dueDate.toLocaleDateString()
          : "Not set";
        document.getElementById("modalStatus").textContent =
          task.status || "Unknown";

        modal.style.display = "flex";
        setTimeout(() => modal.classList.add("show"), 10);
      }

      function closeModal() {
        modal.classList.remove("show");
        setTimeout(() => {
          modal.style.display = "none";
        }, 300);
      }

      function permanentlyDelete() {
        if (!current) return;

        const index = tasks.findIndex((t) => t.id === current.id);
        if (index > -1) {
          // Add confirmation animation
          const deleteBtn = document.querySelector(".btn-danger");
          const originalText = deleteBtn.innerHTML;

          deleteBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Deleting...';
          deleteBtn.disabled = true;

          setTimeout(() => {
            tasks.splice(index, 1);
            localStorage.setItem("deletedTasks", JSON.stringify(tasks));
            showTasks();
            closeModal();

            // Show success message
            showNotification("Task permanently deleted", "success");
          }, 1000);
        }
      }

      function showNotification(message, type = "info") {
        const notification = document.createElement("div");
        notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: ${type === "success" ? "var(--success)" : "var(--danger)"};
        color: white;
        padding: 1rem 1.5rem;
        border-radius: var(--border-radius);
        box-shadow: var(--shadow-lg);
        z-index: 1001;
        transform: translateX(100%);
        transition: transform 0.3s ease;
        font-weight: 600;
      `;
        notification.textContent = message;

        document.body.appendChild(notification);

        setTimeout(() => {
          notification.style.transform = "translateX(0)";
        }, 100);

        setTimeout(() => {
          notification.style.transform = "translateX(100%)";
          setTimeout(() => {
            document.body.removeChild(notification);
          }, 300);
        }, 3000);
      }

      // Close modal when clicking outside
      window.onclick = (e) => {
        if (e.target === modal) {
          closeModal();
        }
      };

      // Add smooth animations on page load
      document.addEventListener("DOMContentLoaded", () => {
        const container = document.querySelector(".container");
        container.style.opacity = "0";
        container.style.transform = "translateY(30px)";

        setTimeout(() => {
          container.style.transition = "all 0.6s ease-out";
          container.style.opacity = "1";
          container.style.transform = "translateY(0)";
        }, 100);

        showTasks();
      });
    </script>
  </body>
</html>
