<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elite Login - To-Do List</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      background-size: cover;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.2);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      transition: all 0.3s ease-in-out;
    }

    .container:hover {
      box-shadow: 0 0 60px rgba(0, 255, 255, 0.4);
      transform: translateY(-5px);
    }

    .navbar {
      position: absolute;
      top: 30px;
      text-align: center;
      width: 100%;
    }

    .navbar h1 {
      color: #0ff;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.8rem;
      font-weight: 600;
      color: #ffffffcc;
    }

    label {
      font-weight: 500;
      font-size: 0.95rem;
      color: #ffffffcc;
      margin-bottom: 5px;
      display: block;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px;
      margin: 10px 0 20px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      box-shadow: inset 0 0 5px rgba(0, 255, 255, 0.1);
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
    }

    input[type="submit"] {
      background: linear-gradient(90deg, #00feca, #00c2ff);
      border: none;
      padding: 14px;
      width: 100%;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 12px;
      color: #000;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    input[type="submit"]:hover {
      transform: scale(1.02);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
    }

    .message,
    .valid {
      text-align: center;
      margin-top: 15px;
      font-size: 1rem;
    }

    .message {
      color: #ff4d4d;
    }

    .valid {
      color: #00ff99;
    }

    .sign-in-link {
      text-align: center;
      margin-top: 20px;
    }

    .sign-in-link a {
      color: #00f0ff;
      text-decoration: none;
      font-weight: 500;
    }

    .sign-in-link a:hover {
      text-decoration: underline;
    }

    .password-container {
      position: relative;
    }

    .eye-icon {
      position: absolute;
      top: 46%;
      right: 14px;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.2rem;
      color: #0ff;
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: #999;
      font-size: 0.9rem;
    }

    @media screen and (max-width: 480px) {
      .container {
        padding: 30px;
        margin: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h1>To-Do Elite</h1>
  </div>

  <div class="container">
    <h2>Welcome Back</h2>
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="e.g. johndoe123" required>

      <label for="password">Password</label>
      <div class="password-container">
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <span id="togglePassword" class="eye-icon">&#128065;</span>
      </div>

      <input type="submit" value="Log In">
      <div id="validationMessage" class="message"></div>

      <div class="sign-in-link">
        <p>Don't have an account? <a href="registration.html">Sign up</a></p>
      </div>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 To-Do Elite. Crafted with precision.</p>
  </footer>

  <script>
    function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const message = document.getElementById('validationMessage');

      const storedUsername = localStorage.getItem('username');
      const storedPassword = localStorage.getItem('password');

      if (username === storedUsername && password === storedPassword) {
        message.textContent = "Access granted. Redirecting...";
        message.className = "valid";
        setTimeout(() => {
          window.location.href = "homepage.html";
        }, 2000);
      } else {
        message.textContent = "Incorrect credentials. Please try again.";
        message.className = "message";
      }
    }

    const togglePassword = document.getElementById("togglePassword");
    const passwordField = document.getElementById("password");

    togglePassword.addEventListener("click", () => {
      const type = passwordField.type === "password" ? "text" : "password";
      passwordField.type = type;
    });
  </script>

</body>
</html>
