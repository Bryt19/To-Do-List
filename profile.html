<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      background-attachment: fixed;
      color: #e0f7fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .navbar {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px 0;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #00feca;
      letter-spacing: 1.2px;
      text-shadow: 0 0 6px #00feca88;
      box-shadow: 0 4px 12px rgba(0, 255, 255, 0.2);
    }

    .container {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 40px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.15);
      margin-top: 40px;
      color: #cde9f3;
      text-align: center;
    }

    h2 {
      font-size: 2.2rem;
      color: #00feca;
      margin-bottom: 20px;
      text-shadow: 0 0 6px #00feca33;
    }

    .profile-pic {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid #00feca;
      object-fit: cover;
      margin-bottom: 15px;
      transition: transform 0.3s;
    }

    .profile-pic:hover {
      transform: scale(1.08);
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .upload-btn, .delete-btn, .edit-bio-btn, .profile-btn, .logout-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.3s, background-color 0.3s;
    }

    .upload-btn {
      background-color: #00feca;
      color: #000;
    }

    .upload-btn:hover {
      background-color: #00dbbb;
      transform: scale(1.05);
    }

    .delete-btn, .logout-btn {
      background-color: red;
      color: white;
    }

    .delete-btn:hover, .logout-btn:hover {
      background-color: #cc0000;
      transform: scale(1.05);
    }

    .edit-bio-btn {
      background-color: #007bff;
      color: white;
    }

    .edit-bio-btn:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }

    .profile-btn {
      background-color: #4CAF50;
      color: white;
      margin-top: 15px;
    }

    .profile-btn:hover {
      background-color: #3c9e42;
      transform: scale(1.05);
    }

    .profile-info p {
      margin-bottom: 10px;
      font-size: 1.05rem;
      color: #bcecf3;
    }

    .profile-info strong {
      color: #00feca;
    }

    .bio-text {
      width: 95%;
      height: 130px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
      margin-top: 10px;
      resize: none;
      font-family: inherit;
    }

    .divider {
      height: 1px;
      background-color: #00feca55;
      margin: 25px 0;
      width: 80%;
      margin-left: auto;
      margin-right: auto;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #aaa;
      font-size: 1rem;
      width: 100%;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }

      .button-container {
        flex-direction: column;
      }

      .upload-btn, .delete-btn, .edit-bio-btn, .profile-btn, .logout-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="navbar">Elite To-Do List</div>

  <div class="container">
    <h2>User Profile</h2>

    <img id="profilePic" class="profile-pic" src="default-profile-pic.jpg" alt="Profile Picture">
    <input type="file" id="profilePicInput" style="display:none;">

    <div class="button-container">
      <button class="upload-btn" id="changePicBtn">Change Picture</button>
      <button class="delete-btn" id="deletePicBtn">Delete Picture</button>
    </div>

    <div class="divider"></div>

    <div class="profile-info">
      <p><strong>Full Name:</strong> <span id="fullName"></span></p>
      <p><strong>Username:</strong> <span id="username"></span></p>
      <p><strong>Email:</strong> <span id="email"></span></p>
      <p><strong>Gender:</strong> <span id="gender"></span></p>
    </div>

    <div class="divider"></div>

    <div class="bio-section">
      <p><strong>Bio:</strong></p>
      <textarea class="bio-text" id="bio" placeholder="Write your bio..."></textarea>
      <button class="edit-bio-btn" id="saveBioBtn">Save Bio</button>
    </div>

    <button class="profile-btn" id="backBtn">Back to Tasks</button>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <footer>&copy; 2025 Elite To-Do List. All rights reserved.</footer>

  <script>
    const defaultProfilePic = './img/default.png';

    const fullName = localStorage.getItem('fullName');
    const username = localStorage.getItem('username');
    const email = localStorage.getItem('email');
    const gender = localStorage.getItem('gender');
    const bio = localStorage.getItem('bio');
    const profilePic = localStorage.getItem('profilePic');

    document.getElementById('fullName').textContent = fullName || 'Not available';
    document.getElementById('username').textContent = username || 'Not available';
    document.getElementById('email').textContent = email || 'Not available';
    document.getElementById('gender').textContent = gender || 'Not available';
    document.getElementById('bio').value = bio || 'Not available';

    const profilePicElement = document.getElementById('profilePic');
    profilePicElement.src = profilePic || defaultProfilePic;

    document.getElementById('saveBioBtn').addEventListener('click', function () {
      const newBio = document.getElementById('bio').value;
      localStorage.setItem('bio', newBio);
    });

    document.getElementById('changePicBtn').addEventListener('click', function () {
      document.getElementById('profilePicInput').click();
    });

    document.getElementById('profilePicInput').addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          profilePicElement.src = e.target.result;
          localStorage.setItem('profilePic', e.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('deletePicBtn').addEventListener('click', function () {
      localStorage.removeItem('profilePic');
      profilePicElement.src = defaultProfilePic;
      localStorage.setItem('profilePic', defaultProfilePic);
    });

    document.getElementById('backBtn').addEventListener('click', function () {
      window.location.href = 'homepage.html';
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
      if (confirm("Do you want to logout?")) {
        localStorage.setItem('isLoggedIn', 'false');
        window.location.href = "index.html";
      }
    });

    const bioTextarea = document.getElementById('bio');
    bioTextarea.addEventListener('focus', () => {
      if (bioTextarea.value === 'Not available') bioTextarea.value = '';
    });
    bioTextarea.addEventListener('blur', () => {
      if (bioTextarea.value === '') bioTextarea.value = 'Not available';
    });
  </script>

</body>
</html>
