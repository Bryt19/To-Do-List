<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elite Registration - To-Do List</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body {
    font-family: 'Outfit', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header, footer {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    text-align: center;
    padding: 15px 0;
    font-weight: 600;
    font-size: 1.2rem;
    letter-spacing: 1.2px;
    color: #00feca;
    text-shadow: 0 0 6px #00feca77;
  }
  main {
    flex-grow: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 40px 30px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 0 40px rgba(0, 255, 255, 0.25);
    transition: all 0.3s ease-in-out;
  }
  .container:hover {
    box-shadow: 0 0 70px rgba(0, 255, 255, 0.45);
    transform: translateY(-6px);
  }
  h2 {
    text-align: center;
    font-weight: 700;
    font-size: 1.8rem;
    margin-bottom: 30px;
    color: #e0f7fa;
    text-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
  }
  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #b0eafc;
    font-size: 0.95rem;
  }
  input[type="text"], input[type="email"], input[type="password"], select {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 22px;
    border-radius: 14px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: #e0f7fa;
    font-size: 1rem;
    box-shadow: inset 0 0 7px rgba(0, 255, 255, 0.15);
    outline: none;
    transition: box-shadow 0.3s ease;
  }
  input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, select:focus {
    box-shadow: 0 0 10px #00ffe7;
    background: rgba(255,255,255,0.15);
  }
  .password-wrapper {
    position: relative;
  }
  .eye-icon {
    position: absolute;
    top: 35%;
    right: 18px;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 1.3rem;
    color: #00feca;
    user-select: none;
    transition: color 0.3s ease;
  }
  .eye-icon:hover {
    color: #00c2ff;
  }
  input[type="submit"] {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(90deg, #00feca, #00c2ff);
    color: #000;
    font-weight: 700;
    font-size: 1.2rem;
    cursor: pointer;
    transition: box-shadow 0.3s ease, transform 0.3s ease;
    margin-top: 10px;
  }
  input[type="submit"]:hover {
    box-shadow: 0 0 18px #00feca;
    transform: translateY(-3px);
  }
  .message {
    text-align: center;
    margin-top: 18px;
    font-size: 1rem;
  }
  .message.error {
    color: #ff4d4d;
    text-shadow: 0 0 4px #ff4d4d88;
  }
  .message.success {
    color: #00ff99;
    text-shadow: 0 0 6px #00ff9977;
  }
  .terms {
    color: #8ff4ff;
    font-size: 0.9rem;
    margin-bottom: 18px;
  }
  .terms input {
    margin-right: 8px;
    cursor: pointer;
  }
  .terms a {
    color: #00feca;
    text-decoration: none;
  }
  .terms a:hover {
    text-decoration: underline;
  }
  .sign-in-link {
    margin-top: 25px;
    text-align: center;
    font-size: 1rem;
    color: #9aeaea;
  }
  .sign-in-link a {
    color: #00feca;
    text-decoration: none;
    font-weight: 600;
  }
  .sign-in-link a:hover {
    text-decoration: underline;
  }
  @media (max-width: 480px) {
    .container {
      padding: 30px 25px;
    }
    h2 {
      font-size: 1.6rem;
    }
  }
</style>
</head>
<body>
<header>Elite To-Do List</header>
<main>
  <div class="container">
    <h2>Create Account</h2>
    <form id="registrationForm" onsubmit="return handleRegistration(event)" novalidate>
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" placeholder="Your full name" required />

      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose username" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Your email" required />

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password" placeholder="Password" required />
        <span id="togglePassword" class="eye-icon" title="Show/Hide Password">&#128065;</span>
      </div>

      <label for="confirmPassword">Confirm Password</label>
      <div class="password-wrapper">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required />
        <span id="toggleConfirmPassword" class="eye-icon" title="Show/Hide Password">&#128065;</span>
      </div>

      <div class="terms">
        <label>
          <input type="checkbox" name="terms" required />
          I agree to the <a href="t&C.html" target="_blank" rel="noopener noreferrer">Terms and Conditions</a>
        </label>
      </div>

      <input type="submit" value="Register" />

      <div id="message" class="message"></div>

      <div class="sign-in-link">
        Already have an account? <a href="index.html">Sign In</a>
      </div>
    </form>
  </div>
</main>
<footer>© 2025 Elite To-Do List. All rights reserved.</footer>

<script>
  function handleRegistration(event) {
    event.preventDefault();

    const fullName = document.getElementById('fullName').value.trim();
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const confirmPassword = document.getElementById('confirmPassword').value.trim();
    const termsChecked = document.querySelector('input[name="terms"]:checked');

    const messageDiv = document.getElementById('message');
    const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+])[A-Za-z\d!@#$%^&*()_+]{8,}$/;

    if (!fullName || !username || !email || !password || !confirmPassword || !termsChecked) {
      messageDiv.textContent = "Fill all fields and accept terms.";
      messageDiv.className = "message error";
      return;
    }

    if (!passwordRegex.test(password)) {
      messageDiv.textContent = "Password must be 8+ chars, 1 uppercase, 1 number & 1 symbol.";
      messageDiv.className = "message error";
      return;
    }

    if (password !== confirmPassword) {
      messageDiv.textContent = "Passwords do not match.";
      messageDiv.className = "message error";
      return;
    }

    localStorage.setItem('fullName', fullName);
    localStorage.setItem('username', username);
    localStorage.setItem('email', email);
    localStorage.setItem('password', password);

    messageDiv.textContent = "Registration successful! Redirecting...";
    messageDiv.className = "message success";

    setTimeout(() => window.location.href = "index.html", 1800);
  }

  const togglePassword = document.getElementById('togglePassword');
  const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');

  togglePassword.addEventListener('click', () => {
    const pwField = document.getElementById('password');
    if (pwField.type === "password") {
      pwField.type = "text";
      togglePassword.textContent = '🙈';
    } else {
      pwField.type = "password";
      togglePassword.textContent = '👁️';
    }
  });

  toggleConfirmPassword.addEventListener('click', () => {
    const cpwField = document.getElementById('confirmPassword');
    if (cpwField.type === "password") {
      cpwField.type = "text";
      toggleConfirmPassword.textContent = '🙈';
    } else {
      cpwField.type = "password";
      toggleConfirmPassword.textContent = '👁️';
    }
  });
</script>
</body>
</html>
